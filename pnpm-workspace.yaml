packages:
  - "apps/*"
  - "packages/*"

autoInstallPeers: false

# Local Windows build workaround: keep native dependency paths under 260 characters.
virtualStoreDir: C:/fl-pnpm

allowBuilds:
  # Native resolver package required by the Expo/Metro dependency graph.
  unrs-resolver: true

onlyBuiltDependencies:
  - esbuild
  - unrs-resolver
